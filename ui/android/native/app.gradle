android {
    defaultConfig {
        ndk {
            abiFilters 'arm64-v8a'
        }
    }
    androidResources {
        noCompress 'onnx', 'pte'
    }
    buildTypes {
        release {
            minifyEnabled true
            debuggable false
        }
    }
}

dependencies {
    implementation project(':agriedge-engine')
}
