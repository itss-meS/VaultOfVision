repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.2
    hooks:
      - id: ruff
      - id: ruff-format
  - repo: local
    hooks:
      - id: no-comments
        name: no code comments
        entry: python -m scripts.check_no_comments .
        language: system
        pass_filenames: false
