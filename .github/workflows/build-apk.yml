name: build-apk

on:
  push:
    branches: [main]
    paths:
      - "ui/**"
      - "schemas/**"
      - ".github/workflows/build-apk.yml"
    tags: ["v*"]
  pull_request:
    paths:
      - "ui/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk-debug:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            ui/web/package-lock.json
            ui/android/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
        working-directory: ui/web
      - run: npm ci
        working-directory: ui/android
      - name: Download models from the executorch release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p models
          if gh release view executorch --repo "${{ github.repository }}"; then
            gh release download executorch --repo "${{ github.repository }}" --dir models --clobber
            for z in models/*.zip; do
              if [ -e "$z" ]; then unzip -o -q "$z" -d models && rm "$z"; fi
            done
          else
            gh release list --repo "${{ github.repository }}" || true
            echo "::warning::release executorch not found, building without models"
          fi
          ls -lhR models
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create signed placeholder knowledge files
        run: |
          pip install cryptography
          python -m scripts.make_dev_assets
          ls -l .dev/knowledge
      - run: npm run prepare:android
        working-directory: ui/android
      - name: Require Llama files in models
        run: |
          for f in llama32_1b_int4.pte tokenizer.model; do
            if [ ! -s "models/$f" ]; then
              echo "::error::models/$f is missing; upload it as a loose asset to the executorch release"
              exit 1
            fi
          done
      - name: Build debug APK
        working-directory: ui/android/android
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --console=plain 2>&1 | tee gradle.log
      - name: Show compile errors
        if: failure()
        working-directory: ui/android/android
        run: grep -n -B2 -A10 -E "error:|What went wrong" gradle.log | head -120
      - name: Reject source maps in APK
        run: |
          APK=$(ls ui/android/android/app/build/outputs/apk/debug/*.apk | head -n 1)
          ls -lh "$APK"
          unzip -l "$APK" | grep -E 'llama32_1b_int4\.pte|tokenizer\.model' || { echo "llama files are not inside the APK"; exit 1; }
          if unzip -l "$APK" | grep -E '\.map$'; then
            echo "source map found in APK"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: agriedge-debug-apk
          path: ui/android/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  apk-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: apk-debug
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
        working-directory: ui/web
      - run: npm ci
        working-directory: ui/android
      - name: Download models from the executorch release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p models
          gh release download executorch --repo "${{ github.repository }}" --dir models --clobber
          for z in models/*.zip; do
            if [ -e "$z" ]; then unzip -o -q "$z" -d models && rm "$z"; fi
          done
          ls -lhR models
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create signed placeholder knowledge files
        run: |
          pip install cryptography
          python -m scripts.make_dev_assets
          ls -l .dev/knowledge
      - run: npm run prepare:android
        working-directory: ui/android
      - name: Require Llama files in models
        run: |
          for f in llama32_1b_int4.pte tokenizer.model; do
            if [ ! -s "models/$f" ]; then
              echo "::error::models/$f is missing; upload it as a loose asset to the executorch release"
              exit 1
            fi
          done
      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - run: ./gradlew assembleRelease --no-daemon
        working-directory: ui/android/android
      - name: Sign APK
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          UNSIGNED=$(ls ui/android/android/app/build/outputs/apk/release/*.apk | head -n 1)
          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$KEY_ALIAS" --ks-pass env:KS_PASS --out agriedge-release.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify agriedge-release.apk
          if unzip -l agriedge-release.apk | grep -E '\.map$'; then
            echo "source map found in APK"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: agriedge-release-apk
          path: agriedge-release.apk
          if-no-files-found: error
