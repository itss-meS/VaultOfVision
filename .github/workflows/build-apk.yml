name: build-apk

on:
  push:
    branches: [main]
    paths:
      - "ui/**"
      - "schemas/**"
      - ".github/workflows/build-apk.yml"
    tags: ["v*"]
  pull_request:
    paths:
      - "ui/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            ui/web/package-lock.json
            ui/android/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm ci
        working-directory: ui/web
      - run: npm ci
        working-directory: ui/android
      - name: Download models from the models-v1 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p models
          gh release download models-v1 --repo "${{ github.repository }}" --dir models --clobber
          for z in models/*.zip; do
            if [ -e "$z" ]; then unzip -o -q "$z" -d models && rm "$z"; fi
          done
          ls -lhR models
      - run: npm run prepare:android
        working-directory: ui/android
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: ui/android/android
      - name: Reject source maps in APK
        run: |
          APK=$(ls ui/android/android/app/build/outputs/apk/debug/*.apk | head -n 1)
          if unzip -l "$APK" | grep -E '\.map$'; then
            echo "source map found in APK"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: agriedge-debug-apk
          path: ui/android/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  apk-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: apk-debug
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm ci
        working-directory: ui/web
      - run: npm ci
        working-directory: ui/android
      - name: Download models from the models-v1 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p models
          gh release download models-v1 --repo "${{ github.repository }}" --dir models --clobber
          for z in models/*.zip; do
            if [ -e "$z" ]; then unzip -o -q "$z" -d models && rm "$z"; fi
          done
          ls -lhR models
      - run: npm run prepare:android
        working-directory: ui/android
      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - run: ./gradlew assembleRelease --no-daemon
        working-directory: ui/android/android
      - name: Sign APK
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          UNSIGNED=$(ls ui/android/android/app/build/outputs/apk/release/*.apk | head -n 1)
          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$KEY_ALIAS" --ks-pass env:KS_PASS --out agriedge-release.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify agriedge-release.apk
          if unzip -l agriedge-release.apk | grep -E '\.map$'; then
            echo "source map found in APK"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: agriedge-release-apk
          path: agriedge-release.apk
          if-no-files-found: error
